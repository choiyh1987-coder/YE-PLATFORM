<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YE PLATFORM v0.4</title><link rel="stylesheet" href="style.css"></head><body><div id="login" class="login"><div class="card login-card"><div class="logo">YE</div><p class="eyebrow">BUSINESS · LIFE · AI</p><h1>YE PLATFORM</h1><p class="muted">예에스테틱과 유니의 통합 운영 플랫폼</p><input id="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn" class="primary">로그인</button><button id="demoBtn">대시보드 미리보기</button><p id="msg" class="msg"></p></div></div><div id="app" class="app hidden"><aside id="side"><div class="side-head"><div class="logo small">YE</div><div><b>YE PLATFORM</b><span>통합 운영 시스템</span></div><button id="close" class="mobile">×</button></div><nav><button data-page="home" class="active">🏠 홈</button><button class="group">🩷 예에스테틱⌄</button><div class="sub"><button data-page="shop">대시보드</button><button data-page="appointments">예약관리</button><button data-page="customers">고객관리</button><button data-page="consultations">피부상담</button><button data-page="treatments">관리기록</button><button data-page="photos">전후사진</button><button data-page="passes">이용권관리</button><button data-page="programs">프로그램관리</button><button data-page="products">제품관리</button><button data-page="inventory">재고관리</button><button data-page="sales">매출관리</button><button data-page="expenses">지출관리</button><button data-page="settlement">자동결산</button><button data-page="marketing">마케팅</button><button data-page="reviews">리뷰관리</button><button data-page="documents">문서관리</button><button data-page="worklog">업무일지</button><button data-page="orders">발주관리</button><button data-page="alerts">알림센터</button></div><button class="group">👩 유니⌄</button><div class="sub"><button data-page="yuni">유니 대시보드</button><button data-page="goals">목표관리</button><button data-page="monthly">월간계획</button><button data-page="weekly">주간계획</button><button data-page="today">오늘의 계획</button><button data-page="projects">프로젝트</button><button data-page="calendar">캘린더</button><button data-page="habits">습관관리</button><button data-page="gratitude">감사일기</button><button data-page="budget">유니 가계부</button><button data-page="sns">SNS 정보함</button><button data-page="books">독서노트</button><button data-page="travel">여행관리</button><button data-page="archive">자료보관함</button><button data-page="memo">메모</button></div><button data-page="assistant">🤖 AI 비서</button><button data-page="settings">⚙ 설정</button></nav><div class="profile"><b>최윤희</b><span>최고관리자</span><button id="logout">로그아웃</button></div></aside><main><header><button id="open" class="mobile">☰</button><div><p class="eyebrow">YE PLATFORM</p><h2 id="title">홈 · 오늘의 브리핑</h2></div><button id="quick" class="primary">＋ 빠른 등록</button></header><section id="content"></section></main></div><div id="modal" class="modal hidden"><div class="card modal-card"><div class="modal-head"><h3>빠른 등록</h3><button id="closeModal">×</button></div><div class="quick"><button>📅 예약 등록</button><button>👩 고객 등록</button><button>💆 관리기록</button><button>🧴 제품 판매</button><button>💸 지출 등록</button><button id="quickTask">✅ 오늘 할 일</button><button>💖 감사일기</button><button>📝 메모</button></div><p class="muted">오늘 할 일부터 Supabase에 실제 저장되도록 연결했습니다.</p></div></div>
<div id="taskModal" class="modal hidden">
  <div class="card modal-card">
    <div class="modal-head"><h3>오늘 할 일 등록</h3><button id="closeTask">×</button></div>
    <label class="form-label">할 일
      <input id="taskTitle" class="form-control" placeholder="예: 장기 미방문 고객 2명 연락">
    </label>
    <label class="form-label">우선순위
      <select id="taskPriority" class="form-control">
        <option>높음</option><option selected>보통</option><option>낮음</option>
      </select>
    </label>
    <button id="saveTask" class="primary full">저장</button>
    <p id="taskMsg" class="msg"></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
