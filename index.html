<!doctype html>
<html lang="ko">
<head>

<title>YE PLATFORM v1.5</title>
<style>
*{box-sizing:border-box} :root{
 --brown:#3b2922;--brown2:#281b17;--gold:#c79659;--cream:#f6f0e9;--paper:#fff;
 --ink:#2b2522;--muted:#81746d;--line:#e8ded4;--rose:#f7e5e7;--green:#e5f2e8;--blue:#e8eef8;
 --shadow:0 12px 30px rgba(55,39,32,.07);--serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif
}
html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 65% 18%,#fff,#f1e6db 56%,#e6d7c9)}
.login-card{width:min(440px,100%);background:#fff;padding:38px;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
.logo{width:70px;height:70px;border-radius:22px;background:var(--brown);display:grid;place-items:center;color:#dfb46f;font-weight:900;font-size:27px}
.eyebrow,.kicker{font-size:10px;letter-spacing:.15em;font-weight:900;color:#a67546;text-transform:uppercase}
.login h1{font-size:34px;margin:14px 0 4px}.muted{color:var(--muted)}.small{font-size:11px;color:var(--muted)}
.label{display:block;font-weight:800;margin-top:15px}.control{width:100%;margin-top:7px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.primary,.secondary,.ghost,.text-btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900}.primary{background:var(--brown);color:#fff}.secondary{background:#eee8e3;color:var(--brown)}.ghost{background:#fff;border:1px solid var(--line);color:var(--brown)}.text-btn{background:transparent;color:#9b6b3e;padding:5px}.full{width:100%}
.login .primary,.login .secondary{margin-top:13px}.msg{min-height:18px;color:#b33d35;font-size:12px}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
aside{height:100vh;position:sticky;top:0;background:linear-gradient(180deg,var(--brown),var(--brown2));color:#fff;padding:14px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:7px 8px 18px}.brand .logo{width:42px;height:42px;border-radius:13px;font-size:15px;flex:none}.brand strong{display:block;font-size:17px}.brand span{font-size:10px;color:#c8bbb4}
nav{display:grid;gap:2px}nav button{border:0;background:transparent;color:#e4d9d3;text-align:left;padding:9px 11px;border-radius:11px;font-weight:800;font-size:13px}nav button:hover,nav button.active{background:#ffffff14;color:#fff}.group{display:flex!important;justify-content:space-between}.sub{display:grid;gap:1px;padding:2px 0 7px 11px}.sub button{font-size:12px;color:#cdbfb7;padding:8px 10px}
.profile{margin-top:18px;border:1px solid #ffffff1c;padding:12px;border-radius:14px}.profile span{display:block;font-size:10px;color:#c9bbb3;margin-top:3px}.profile button{width:100%;margin-top:8px;border:0;border-radius:10px;padding:9px;background:#ffffff12;color:#fff}
main{min-width:0}header{height:84px;position:sticky;top:0;z-index:20;background:#fffdfbdd;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 28px}
header h2{font-size:23px;margin:3px 0 0}#content{padding:24px 28px;max-width:1600px;margin:auto}
.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:18px;background:linear-gradient(115deg,#fff9f1,#efd9b7);border:1px solid #ead8c5;border-radius:22px;padding:27px 31px;box-shadow:var(--shadow)}
.hero h3{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.45;margin:4px 0 7px}.hero-note{background:var(--brown);color:#fff;border-radius:17px;padding:17px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.metric{background:#fff;border:1px solid #eee5dc;border-radius:16px;padding:16px;box-shadow:var(--shadow)}.metric span{font-size:11px;color:var(--muted)}.metric b{display:block;font-family:var(--serif);font-size:24px;margin-top:7px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.span2{grid-column:span 2}.span4{grid-column:span 4}
.panel{background:#fff;border:1px solid #eee5dc;border-radius:17px;padding:18px;box-shadow:var(--shadow)}.panel h3{font-size:16px;margin:0 0 12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h3{margin:0}
.list{display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 11px;background:#faf7f3;border-radius:12px;border:0;width:100%;text-align:left}.row b{font-size:12px}.row small{font-size:10px;color:var(--muted)}
.badge{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:var(--rose);white-space:nowrap}.badge.green{background:var(--green)}.badge.blue{background:var(--blue)}
.check{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}.check input{width:17px;height:17px}
.progress{height:9px;background:#eee7e1;border-radius:999px;overflow:hidden}.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--gold),#b68148)}
.page-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:16px}.page-head h3{font-family:var(--serif);font-size:24px;font-weight:500;margin:0 0 4px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:700px;background:#fff}th,td{padding:10px 11px;border-bottom:1px solid #eee8e2;font-size:12px;text-align:left}th{background:#faf7f3;color:#675d57}
.empty{text-align:center;padding:38px 18px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
.quickcards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left}.action-card b{display:block;font-size:12px;margin-bottom:4px}.action-card span{font-size:10px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:100;background:#291e19b0;display:grid;place-items:center;padding:18px}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:23px;padding:22px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.x{border:0;background:transparent;font-size:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.toast{position:fixed;right:20px;bottom:20px;z-index:150;background:var(--brown);color:#fff;padding:12px 15px;border-radius:12px}
.journal-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:13px}.journal-wide{grid-column:1/-1}.journal-lines{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.journal-line{display:grid;grid-template-columns:25px 1fr;gap:6px;align-items:center}.journal-line span{text-align:center;color:#a47750;font-family:var(--serif)}.journal-line input{margin:0;padding:8px 9px}
.reflection-grid,.sales-report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sales-report-grid{grid-template-columns:repeat(3,1fr)}.report-box{padding:13px;border:1px solid var(--line);border-radius:12px;background:#faf7f3}.report-box span{font-size:10px;color:var(--muted)}.report-box b{display:block;font-family:var(--serif);font-size:20px;margin-top:5px}
.upload-zone{margin-top:10px;padding:15px;border:1px dashed #cfbca9;border-radius:13px;background:#faf6f1;text-align:center}.photo-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.photo-preview img{width:100%;height:86px;object-fit:cover;border-radius:9px}
.journal-datebar{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;margin-bottom:13px}.date-main{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-weight:900}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.week-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}.week-head span{text-align:center;font-size:10px;color:var(--muted);font-weight:800}
.month-grid,.small-calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.month-cell{min-height:112px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:11px;background:#fff}.month-cell.today{border:2px solid var(--gold)}.empty-cell{background:transparent;border-color:transparent}.month-events{display:grid;gap:3px;margin-top:7px}.ev{display:block;padding:3px 4px;border-radius:5px;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.shop{background:#f7e5e6}.ev.journal{background:#f5ebd9}.cal-day{min-height:54px;border:1px solid var(--line);border-radius:9px;background:#fff;position:relative}.record-dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#d19a5b;bottom:6px;left:50%;transform:translateX(-50%)}
.mobile{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.span4{grid-column:span 2}.hero{grid-template-columns:1fr}}
@media(max-width:780px){.app{display:block}aside{position:fixed;left:-270px;width:244px;z-index:80;transition:.2s}aside.open{left:0}.mobile{display:inline-block}header{height:72px;padding:11px 14px}header h2{font-size:19px}#content{padding:14px}.cards,.grid,.quickcards{grid-template-columns:1fr}.span2,.span4{grid-column:span 1}.journal-layout{grid-template-columns:1fr}.journal-wide{grid-column:auto}.journal-lines{grid-template-columns:1fr}.form-grid,.reflection-grid,.sales-report-grid{grid-template-columns:1fr}.month-cell{min-height:80px;padding:5px}.photo-preview{grid-template-columns:repeat(2,1fr)}}

/* v1.4 연결 + 엑셀형 자동화 */
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sheet-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:#faf7f3}
.sheet-toolbar .right{display:flex;gap:7px;flex-wrap:wrap}
.sheet table{border:0;border-radius:0}
.sheet tfoot td{font-weight:900;background:#fbf6ef}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.sum-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.sum-box span{font-size:10px;color:var(--muted)}.sum-box b{display:block;font-family:var(--serif);font-size:22px;margin-top:5px}
.link-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left}
.file-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#f3eee8;font-size:10px}
@media(max-width:900px){.summary-strip{grid-template-columns:repeat(2,1fr)}}


/* v1.5 - contextual dashboard back + business cashbook */
.page-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dashboard-back{background:#fff;border:1px solid var(--line);color:var(--brown);padding:10px 13px;border-radius:12px;font-weight:900}
.ledger-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 12px;margin-bottom:12px}
.ledger-nav strong{font-family:var(--serif);font-size:19px}
.ledger-nav .nav-side{display:flex;align-items:center;gap:7px}
.ledger-table .income{font-weight:900}
.ledger-table .outflow{font-weight:900}
.ledger-table .balance{font-weight:900}
.ledger-type{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#f6eee7}
.ledger-type.out{background:#f7e5e6}
.cashbook-note{padding:11px 13px;border-radius:13px;background:#fff8ee;border:1px solid #eddcc6;color:var(--muted);font-size:11px;margin-bottom:12px}
@media(max-width:780px){
 .page-head{align-items:flex-start}.page-head-actions{width:100%;justify-content:flex-start}
 .ledger-nav{align-items:flex-start;flex-direction:column}
}

</style>
</head>

function todayISO(){return new Date().toISOString().slice(0,10)}

function pageHead(t,d,a=""){
 const shopPages=["appointments","customers","consultations","treatments","photos","passes","programs","products","inventory","sales","expenses","settlement","marketing","reviews","documents"];
 const yuniPages=["goals","monthly","weekly","today","projects","calendar","habits","gratitude","budget","sns"];
 let back="";
 if(shopPages.includes(currentPage))back=`<button class="dashboard-back" data-go="shop">🏠 대시보드</button>`;
 else if(yuniPages.includes(currentPage))back=`<button class="dashboard-back" data-go="yuni">🏠 유니 대시보드</button>`;

 if(type==="pass"){const total=Number($("#fTotalSessions").value||0);tableName="customer_passes";payload={customer_id:$("#fCustomer").value||null,pass_name:$("#fPassName").value,total_sessions:total,used_sessions:0,remaining_sessions:total,end_date:$("#fEndDate").value||null,status:"사용중",created_by:user.id,updated_by:user.id}}
 if(type==="program"){tableName="programs";payload={name:$("#fProgramName").value,duration_minutes:Number($("#fDuration").value||0),regular_price:Number($("#fPrice").value||0),is_active:true,is_deleted:false,created_by:user.id,updated_by:user.id}}
 if(type==="product"){tableName="products";payload={name:$("#fProductName").value,brand:$("#fBrand").value,sale_price:Number($("#fPrice").value||0),current_stock:Number($("#fStock").value||0),safety_stock:Number($("#fSafety").value||0),is_active:true,is_deleted:false,created_by:user.id,updated_by:user.id}}
 if(type==="task"){tableName="yuni_tasks";payload={user_id:user.id,title:$("#fTask").value,task_date:todayISO(),priority:"보통",status:"미완료"}}
 if(type==="goal"){tableName="yuni_goals";payload={user_id:user.id,title:$("#fTitle").value,goal_type:$("#fGoalType").value,due_date:$("#fDue").value||null,status:"진행중"}}
 if(type==="project"){tableName="yuni_projects";payload={user_id:user.id,title:$("#fTitle").value,description:$("#fDesc").value,status:"진행중",progress:0}}
 if(type==="habit"){tableName="yuni_habits";payload={user_id:user.id,title:$("#fTitle").value,frequency:$("#fFrequency").value,is_active:true}}
 if(!tableName)return toast("저장 연결이 없는 항목입니다.");
 const {error}=await client.from(tableName).insert(payload);if(error)throw error;
 closeModal();toast("저장되었습니다.");await loadAll();render(target);
}

async function enter(){ $("#login").classList.add("hidden");$("#app").classList.remove("hidden");$("#profileEmail").textContent=user?.email||"미리보기";render("home");try{await loadAll()}catch(e){console.warn(e)}render(currentPage)}
async function init(){
 $("#loginBtn").onclick=async()=>{const email=$("#email").value.trim(),password=$("#password").value;if(!email||!password)return $("#loginMsg").textContent="이메일과 비밀번호를 입력해주세요.";try{$("#loginBtn").textContent="로그인 중...";const {data,error}=await client.auth.signInWithPassword({email,password});if(error)return $("#loginMsg").textContent=error.message;user=data.user;preview=false;await enter()}finally{$("#loginBtn").textContent="로그인"}};
 $("#previewBtn").onclick=async()=>{preview=true;user=null;await enter()};
 $("#logoutBtn").onclick=async()=>{if(client&&!preview)await client.auth.signOut();location.reload()};
 $("#openSide").onclick=()=>$("#side").classList.add("open");$("#closeSide").onclick=()=>$("#side").classList.remove("open");$("#closeModal").onclick=closeModal;
 document.addEventListener("click",async e=>{
 const saveJournalBtn=e.target.closest('[data-action="save-journal"]');if(saveJournalBtn){await saveJournal();return}
 const p=e.target.closest("[data-page]");if(p){render(p.dataset.page);return}
 const g=e.target.closest("[data-group]");if(g){document.querySelector(`[data-sub="${g.dataset.group}"]`)?.classList.toggle("hidden");return}
 const go=e.target.closest("[data-go]");if(go){render(go.dataset.go);return}
 const sh=e.target.closest("[data-journal-shift]");if(sh){shiftJournal(Number(sh.dataset.journalShift));return}
 const jd=e.target.closest("[data-journal-date]");if(jd){selectJournal(jd.dataset.journalDate);return}
 const cal=e.target.closest("[data-cal]");if(cal){calendarCursor.setMonth(calendarCursor.getMonth()+Number(cal.dataset.cal));render("calendar");return}
 const jc=e.target.closest("[data-jcal]");if(jc){calendarCursor.setMonth(calendarCursor.getMonth()+Number(jc.dataset.jcal));journalCalendar();return}
 const day=e.target.closest("[data-day]");if(day){selectedJournalDate=day.dataset.day;render("gratitude");return}
 const save=e.target.closest("[data-save]");if(save){await saveSimple(save.dataset.save);return}
 const action=e.target.closest("[data-action]");if(action){if(action.dataset.action==="journal-calendar"){journalCalendar();return}openSimpleForm(action.dataset.action);return}
 const lm=e.target.closest("[data-ledger-month]");if(lm){businessLedgerMonth=lm.dataset.ledgerMonth;render("sales");return}
 const ex=e.target.closest("[data-export]");if(ex){
 const type=ex.dataset.export;
 if(type==="sales")exportCSV("매출.csv",["날짜","고객","구분","금액"],D.sales6.map(x=>[x.sale_date,cname(x.customer_id),x.sale_type,x.net_amount]));
 if(type==="business-ledger"){
   const month=businessLedgerMonth||todayISO().slice(0,7);
   const arr=[
    ...D.sales6.filter(x=>monthKey(x.sale_date)===month).map(x=>({date:x.sale_date,kind:"입금",category:x.sale_type||"매출",detail:x.memo||"",party:cname(x.customer_id),income:Number(x.net_amount||0),outflow:0})),
    ...D.expenses6.filter(x=>monthKey(x.expense_date)===month).map(x=>({date:x.expense_date,kind:"출금",category:x.category||"기타",detail:x.description||x.memo||"",party:"",income:0,outflow:Number(x.amount||0)}))
   ].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
   let bal=0;arr.forEach(x=>{bal+=x.income-x.outflow;x.balance=bal});
   exportCSV(`예에스테틱_입출금_${month}.csv`,["날짜","구분","분류","내용","고객/거래처","입금","출금","잔액"],arr.map(x=>[x.date,x.kind,x.category,x.detail,x.party,x.income||"",x.outflow||"",x.balance]));
 }
 if(type==="expenses")exportCSV("지출.csv",["날짜","분류","내용","금액"],D.expenses6.map(x=>[x.expense_date,x.category,x.description,x.amount]));
 if(type==="inventory")exportCSV("재고.csv",["제품","현재재고","안전재고","판매가"],D.products.map(x=>[x.name,x.current_stock,x.safety_stock,x.sale_price]));
 if(type==="budget")exportCSV("유니가계부.csv",["날짜","구분","분류","내용","금액"],D.budget.map(x=>[x.entry_date,x.entry_type,x.category,x.description,x.amount]));
 return
}
const ai=e.target.closest("[data-ai]");if(ai){toast("AI 연결은 다음 단계에서 안전하게 연결합니다.");return}
});
document.addEventListener("change",e=>{
 if(e.target.id==="selfcarePhotos")showPhotos(e.target);
 if(e.target.id==="fPhoto"){
   const t=$("#photoPreview");if(!t)return;t.innerHTML="";
   [...e.target.files].slice(0,1).forEach(f=>{const r=new FileReader();r.onload=ev=>{const img=document.createElement("img");img.src=ev.target.result;t.appendChild(img)};r.readAsDataURL(f)});
 }
});
 $("#quickBtn").onclick=()=>openModal("빠른 등록",`<div class="quickcards"><button class="action-card" data-action="appointment"><b>📅 예약</b><span>예약 등록</span></button><button class="action-card" data-action="customer"><b>👩 고객</b><span>고객 등록</span></button><button class="action-card" data-action="expense"><b>💸 지출</b><span>지출 등록</span></button><button class="action-card" data-action="task"><b>✅ 할 일</b><span>오늘 할 일</span></button></div>`);
 const {data}=await client.auth.getSession();if(data.session){user=data.session.user;preview=false;await enter()}
}
(async()=>{try{client=window.supabase.createClient(CONFIG.url,CONFIG.key);await init()}catch(e){$("#loginMsg").textContent="초기 연결 오류: "+(e.message||e)}})();
</script>
